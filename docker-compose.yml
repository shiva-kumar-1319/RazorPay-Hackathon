services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recoverx}:${POSTGRES_PASSWORD:-recoverx}@postgres:5432/${POSTGRES_DB:-recoverx}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      AUTO_CREATE_SCHEMA: "false"
    networks:
      - recoverx-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recoverx}
      POSTGRES_USER: ${POSTGRES_USER:-recoverx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoverx}
    # Secure: DB port is not exposed on host network; accessible only via internal bridge network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoverx} -d ${POSTGRES_DB:-recoverx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recoverx-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Secure: Redis port is not exposed on host network; accessible only via internal bridge network
    networks:
      - recoverx-net

volumes:
  postgres_data:

networks:
  recoverx-net:
    driver: bridge
