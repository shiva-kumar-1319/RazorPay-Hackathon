services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://recoverx:recoverx@postgres:5432/recoverx
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      AUTO_CREATE_SCHEMA: "false"
    networks:
      - recoverx-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoverx
      POSTGRES_USER: recoverx
      POSTGRES_PASSWORD: recoverx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverx -d recoverx"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recoverx-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - recoverx-net

volumes:
  postgres_data:

networks:
  recoverx-net:
    driver: bridge
